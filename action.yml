name: "LeetCode Card"
description: "Render a self-hosted animated LeetCode contest rating card (SVG) into your repo"
author: "Sagargupta16"

branding:
  icon: "trending-up"
  color: "orange"

inputs:
  username:
    description: "Your LeetCode username, as in leetcode.com/u/<username>"
    required: true
  output:
    description: "Where to write the SVG, relative to the repository root. Several paths, one per line, write several cards from one fetch; end a line with ?theme=<name> to give that card its own theme"
    required: false
    default: "assets/leetcode.svg"
  theme:
    description: "Card theme: dark, light, github-dark, github-light, dracula or nord"
    required: false
    default: "dark"
  accent:
    description: "Accent color as #rgb or #rrggbb: the rating line, the badge line, the heading and the heatmap. Empty uses the theme's accent. A color that does not reach 4.5:1 contrast on the card is lightened (dark themes) or darkened (light themes) until it does"
    required: false
    default: ""
  heatmap:
    description: "true adds a heatmap of daily submissions over the past year under the card"
    required: false
    default: "false"
  title:
    description: "Card heading; {contests} is replaced with the number of rated contests attended"
    required: false
    default: "LEETCODE CONTEST RATING | {contests} CONTESTS"

outputs:
  rating:
    description: "Current contest rating, rounded; empty if the user has no rated contest"
    value: ${{ steps.card.outputs.rating }}
  badge:
    description: "Contest badge such as Knight or Guardian; empty if the user has none"
    value: ${{ steps.card.outputs.badge }}
  solved:
    description: "Number of problems solved"
    value: ${{ steps.card.outputs.solved }}
  contests:
    description: "Number of rated contests attended"
    value: ${{ steps.card.outputs.contests }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Render the LeetCode card
      id: card
      shell: bash
      env:
        LEETCODE_USERNAME: ${{ inputs.username }}
        LEETCODE_OUTPUT: ${{ inputs.output }}
        LEETCODE_ACCENT: ${{ inputs.accent }}
        LEETCODE_TITLE: ${{ inputs.title }}
        LEETCODE_THEME: ${{ inputs.theme }}
        LEETCODE_HEATMAP: ${{ inputs.heatmap }}
      run: python "${{ github.action_path }}/leetcode_card.py"
